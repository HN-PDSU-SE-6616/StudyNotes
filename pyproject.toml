[project]
name = "taot-kb"
version = "3.0.0"
description = "Taot 知识库：多组织笔记 + 文件流水线 + RAG 问答 + 推荐"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "sqlalchemy==2.0.50",
    "sqlmodel==0.0.19",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.2.1",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "aiofiles==23.2.1",
    "async-lru==2.0.5",
    "email-validator==2.3.0",
    "qdrant-client==1.13.3",
    "celery==5.5.3",
    "redis==5.2.1",
    "openai==1.68.2",
    "orjson==3.11.9",
    "Markdown==3.6",
    "PyYAML==6.0.3",
    "typer==0.26.7",
    "rich==15.0.0",
    "greenlet==3.5.1",
    "dnspython==2.8.0",
    "beautifulsoup4==4.12.3",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
# 可选 AI 依赖：本地 Embedding（BGE-M3）+ 向量计算（体积较大，按需安装）
ai = [
    "torch>=2.5.1",
    "sentence-transformers>=3.3.1",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
# 从 requirements*.txt 迁移后，保留旧清单作为历史说明；环境以 uv.lock 为准
