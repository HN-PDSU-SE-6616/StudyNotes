# ============================================================
#   Taot 知识库 — 应用编排（backend/worker/beat）
#   基础服务（PostgreSQL/Redis/MySQL/Qdrant）为独立容器，
#   由 deploy/infra.ps1 管理并连接外部网络 taot-net。
#   compose down 不会影响基础服务与数据卷。
# ============================================================
name: taot-kb

services:
  # FastAPI 后端（含迁移入口）；先等待基础服务再启动
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taot-backend
    command: >
      sh -c "python /app/wait_services.py &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://taot:taot@taot-postgres:5432/taot
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://taot-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - STORAGE_ROOT=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./static:/app/static
    restart: unless-stopped

  # Celery Worker：文件解析 + 向量索引
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taot-worker
    command: >
      sh -c "python /app/wait_services.py &&
             celery -A app.worker.celery_app worker -Q parse,index -l info"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DATABASE_URL=postgresql+asyncpg://taot:taot@taot-postgres:5432/taot
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://taot-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - STORAGE_ROOT=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./static:/app/static
    restart: unless-stopped

  # Celery Beat：推荐等定时任务
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taot-beat
    command: >
      sh -c "python /app/wait_services.py &&
             celery -A app.worker.celery_app beat -l info"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - DATABASE_URL=postgresql+asyncpg://taot:taot@taot-postgres:5432/taot
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://taot-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - STORAGE_ROOT=/app/storage
    restart: unless-stopped

networks:
  # 由 deploy/infra.ps1 创建的外部网络：独立基础容器与应用容器共享
  default:
    name: taot-net
    external: true
